{% extends 'catalog/base.html' %}

{% block title %}{{ product.name }}{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-6">
        {% if product.image %}
            <img src="{{ product.image.url }}" class="img-fluid rounded shadow-sm" alt="{{ product.name }}">
        {% else %}
            <img src="https://via.placeholder.com/600x400?text=Нет+изображения" class="img-fluid rounded shadow-sm" alt="Нет изображения">
        {% endif %}
    </div>
    <div class="col-md-6">
        <h1 class="mb-3">{{ product.name }}</h1>
        <p class="text-muted">Категория: {{ product.category.name }}</p>
        <p class="lead">{{ product.description }}</p>
        <h3 class="text-primary">{{ product.price }} ₽</h3>
        <a href="{% url 'catalog:home' %}" class="btn btn-secondary mt-3">← Назад к товарам</a>
    </div>
</div>
{% endblock %}
